<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>익명 중보기도 요청 | 새빛교회</title><style>:root{--bg:#f7f7f3;--card:#fff;--text:#1f2933;--muted:#6b7280;--line:#e5e7eb;--accent:#244a5a;--soft:#e8f0f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;line-height:1.7}a{text-decoration:none;color:inherit}.wrap{max-width:760px;margin:auto;padding:0 18px}header{position:sticky;top:0;background:rgba(247,247,243,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:10}.top{display:flex;justify-content:space-between;align-items:center;padding:15px 0}.brand{font-weight:800}.home{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:.82rem;font-weight:700}.hero{padding:54px 0 24px}.hero h1{font-size:2rem;line-height:1.25;margin:8px 0}.hero p{color:var(--muted)}.notice{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:18px;font-size:.9rem}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin:18px 0;box-shadow:0 12px 30px rgba(0,0,0,.05)}label{display:block;font-weight:800;margin:14px 0 6px}input,textarea,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;font:inherit}textarea{min-height:160px;resize:vertical}.check{display:flex;gap:9px;align-items:flex-start;margin-top:14px;color:var(--muted);font-size:.9rem}.check input{width:auto;margin-top:5px}.btn{width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;padding:13px;font-weight:800;font-size:1rem;margin-top:16px;cursor:pointer}.board-title{display:flex;justify-content:space-between;align-items:center}.empty{color:var(--muted);text-align:center;padding:24px}.post{border-top:1px solid var(--line);padding:14px 0}.post:first-child{border-top:0}.post small{color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:.78rem;padding:30px 0}</style></head><body><header><div class="wrap top"><div class="brand">기독교대한감리회 새빛교회</div><a class="home" href="index.html">교회 홈</a></div></header><main class="wrap"><section class="hero"><div style="font-size:.78rem;font-weight:800;color:var(--accent)">PRAYER REQUEST</div><h1>익명 중보기도 요청</h1><p>이름을 남기지 않아도 괜찮습니다. 함께 기도하기 원하는 내용을 남겨 주세요.</p><div class="notice"><strong>안내</strong><br>현재는 게시판 화면을 먼저 만든 단계입니다. 이 페이지에서 작성한 내용은 이 기기의 브라우저에만 임시 저장되며 다른 사람에게 공개되지 않습니다. 실제 익명 게시판으로 운영하려면 별도의 저장 서비스 연결이 필요합니다.</div></section><section class="card"><form id="form"><label for="category">기도 제목 분류</label><select id="category"><option>가정</option><option>건강</option><option>진로·직장</option><option>관계</option><option>신앙</option><option>기타</option></select><label for="title">기도 제목</label><input id="title" maxlength="80" placeholder="예: 가족을 위해 기도해 주세요" required><label for="content">기도 요청 내용</label><textarea id="content" maxlength="1200" placeholder="개인정보는 꼭 필요한 경우에만 적어 주세요." required></textarea><label class="check"><input id="agree" type="checkbox" required><span>민감한 개인정보를 과도하게 적지 않으며, 중보기도를 위한 목적으로 작성합니다.</span></label><button class="btn" type="submit">익명으로 기도 요청 남기기</button></form></section><section class="card"><div class="board-title"><h2 style="margin:0">내 기도 요청</h2><button id="clear" style="border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;cursor:pointer">전체 삭제</button></div><div id="posts"></div></section></main><footer>기독교대한감리회 새빛교회 · 중보기도 요청</footer><script>const KEY='saebitPrayerDrafts';const posts=document.getElementById('posts');function load(){return JSON.parse(localStorage.getItem(KEY)||'[]')}function draw(){const list=load();if(!list.length){posts.innerHTML='<div class="empty">아직 이 기기에 저장된 기도 요청이 없습니다.</div>';return}posts.innerHTML=list.slice().reverse().map(p=>'<div class="post"><strong>'+esc(p.title)+'</strong><br><small>'+esc(p.category)+' · '+esc(p.date)+'</small><p>'+esc(p.content).replace(/\n/g,'<br>')+'</p></div>').join('')}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}document.getElementById('form').onsubmit=e=>{e.preventDefault();const list=load();list.push({category:category.value,title:title.value.trim(),content:content.value.trim(),date:new Date().toLocaleString('ko-KR')});localStorage.setItem(KEY,JSON.stringify(list));e.target.reset();draw();alert('이 기기에 임시 저장되었습니다.');};document.getElementById('clear').onclick=()=>{if(confirm('이 기기에 저장된 기도 요청을 모두 삭제할까요?')){localStorage.removeItem(KEY);draw()}};draw();</script></body></html>
